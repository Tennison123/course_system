<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบคอร์สออนไลน์ — Online Course</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">🎓 ระบบคอร์สออนไลน์ <span>Online Course</span></div>
    <nav><a href="/" class="active">จัดการข้อมูล</a><a href="/report">รายงาน</a></nav>
  </header>
  <main class="container">
    <div class="tabs">
      <button class="tab active" data-entity="learners">ผู้เรียน</button>
      <button class="tab" data-entity="courses">คอร์ส</button>
      <button class="tab" data-entity="lessons">บทเรียน</button>
      <button class="tab" data-entity="enrollments">การลงทะเบียน</button>
      <button class="tab" data-entity="progress_manager">จัดการ Progress</button>
    </div>

    <!-- ส่วน CRUD ปกติ (ผู้เรียน, คอร์ส, บทเรียน, การลงทะเบียน) -->
    <div id="crudSection">
      <section class="card">
        <h3>ค้นหา <span id="searchTitle"></span></h3>
        <div id="searchFields" class="search-grid"></div>
        <div class="btn-row">
          <button class="btn add" id="btnAdd">+ เพิ่มข้อมูลใหม่</button>
          <button class="btn" id="btnClear" style="margin-left:auto">ล้างเงื่อนไข</button>
          <button class="btn primary" id="btnSearch">🔍 ค้นหา</button>
        </div>
      </section>
      <section class="card">
        <div id="status" class="status"></div>
        <div class="table-wrap"><table id="resultTable"><thead><tr id="tableHead"></tr></thead><tbody id="tableBody"></tbody></table></div>
      </section>
    </div>

    <!-- ส่วนจัดการ Progress (จะแสดงเฉพาะตอนกดแท็บ จัดการ Progress เท่านั้น) -->
    <div id="progressSection" style="display: none;">
      <section class="card">
        <h3>จัดการ Progress การเรียน</h3>
        <div class="field" style="margin-bottom: 16px;">
          <label>เลือกรายการลงทะเบียน (Enrollment):</label>
          <select id="selEnrollment" onchange="loadEnrollmentProgress(this.value)">
            <option value="">— กรุณาเลือกรายการลงทะเบียน —</option>
          </select>
        </div>

        <div id="progressCard" style="display: none; border: 1px solid #cbd5e0; padding: 16px; border-radius: 6px; background: #fff;">
          <div style="border-bottom: 1px solid #edf2f7; padding-bottom: 12px; margin-bottom: 16px; line-height: 1.8;">
            <h4 id="p_enroll_title" style="margin: 0 0 8px 0; color: #2563eb;">Enrollment #--</h4>
            <div><strong>ผู้เรียน:</strong> <span id="p_learner_name">—</span></div>
            <div><strong>คอร์ส:</strong> <span id="p_course_title">—</span></div>
            <div><strong>สถานะ:</strong> <span id="p_status" class="status">—</span></div>
          </div>

          <h4 style="margin-bottom: 10px;">บทเรียน</h4>
          <div id="lessonList" style="margin: 16px 0; display: flex; flex-direction: column; gap: 8px;"></div>

          <div style="text-align: center; margin-top: 20px;">
            <button class="btn primary" onclick="saveEnrollmentProgress()">[ บันทึก Progress ]</button>
          </div>
        </div>
        <div id="progressMsg" class="status" style="margin-top: 10px;"></div>
      </section>
    </div>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modalTitle">เพิ่มข้อมูล</h3>
      <div id="formFields"></div>
      <div class="btn-row">
        <button class="btn primary" id="btnSave">บันทึก</button>
        <button class="btn" id="btnCancel">ยกเลิก</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
