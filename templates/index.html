<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบคอร์สออนไลน์ — Online Course</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  
  <!-- Sidebar Menu (ด้านซ้าย) -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-brand">เมนูจัดการ</div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-link active" onclick="switchView('home', this)">🏠 หน้าหลัก (คอร์ส)</a>
      <a href="#" class="nav-link" onclick="switchView('learners', this)">👨‍🎓 จัดการผู้เรียน</a>
      <a href="#" class="nav-link" onclick="switchView('courses', this)">📚 จัดการคอร์ส</a>
      <a href="#" class="nav-link" onclick="switchView('lessons', this)">🎬 จัดการบทเรียน</a>
      <a href="#" class="nav-link" onclick="switchView('enrollments', this)">📝 การลงทะเบียน</a>
      <a href="#" class="nav-link" onclick="switchView('progress_manager', this)">✅ จัดการ Progress</a>
      <a href="/report" class="nav-link">📊 ดูรายงาน</a>
    </nav>
  </aside>

  <!-- Main Content Area -->
  <div class="main-content" id="mainContent">
    
    <!-- Topbar (แถบด้านบน) -->
    <header class="topbar">
      <button class="hamburger-btn" onclick="toggleSidebar()">☰</button>
      <div class="brand-title">🎓 ระบบคอร์สออนไลน์ <span>Online Course</span></div>
    </header>

    <main class="container">
      
      <!-- 1. หน้า Home (แสดงคอร์ส) -->
      <div id="homeSection" class="view-section">
        <h2 class="page-title">วิชาที่เปิดสอนทั้งหมด</h2>
        <div id="courseGrid" class="course-grid">
          <!-- การ์ดคอร์สจะถูกวาดลงที่นี่โดย JS -->
        </div>
      </div>

      <!-- 2. หน้าจัดการข้อมูล (CRUD) -->
      <div id="crudSection" class="view-section hidden">
        <section class="card">
          <h3>ค้นหา <span id="searchTitle"></span></h3>
          <div id="searchFields" class="search-grid"></div>
          <div class="btn-row" style="margin-top: 16px;">
            <button class="btn add" id="btnAdd">+ เพิ่มข้อมูลใหม่</button>
            <button class="btn" id="btnClear" style="margin-left:auto">ล้างเงื่อนไข</button>
            <button class="btn primary" id="btnSearch">🔍 ค้นหา</button>
          </div>
        </section>
        <section class="card mt-4">
          <div id="status" class="status"></div>
          <div class="table-wrap">
            <table id="resultTable">
              <thead><tr id="tableHead"></tr></thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </section>
      </div>

      <!-- 3. หน้าจัดการ Progress -->
      <div id="progressSection" class="view-section hidden">
        <section class="card">
          <h3>จัดการ Progress การเรียน</h3>
          <div class="field" style="margin-bottom: 16px;">
            <label>เลือกรายการลงทะเบียน (Enrollment):</label>
            <select id="selEnrollment" onchange="loadEnrollmentProgress(this.value)">
              <option value="">— กรุณาเลือกรายการลงทะเบียน —</option>
            </select>
          </div>

          <div id="progressCard" class="hidden progress-board">
            <div class="progress-header">
              <h4 id="p_enroll_title" style="color: #2563eb; margin-bottom:8px;">Enrollment #--</h4>
              <div><strong>ผู้เรียน:</strong> <span id="p_learner_name">—</span></div>
              <div><strong>คอร์ส:</strong> <span id="p_course_title">—</span></div>
              <div><strong>สถานะ:</strong> <span id="p_status" class="status">—</span></div>
            </div>
            <h4 style="margin: 16px 0 10px;">บทเรียนทั้งหมด</h4>
            <div id="lessonList" class="lesson-list"></div>
            <div style="text-align: center; margin-top: 24px;">
              <button class="btn primary" onclick="saveEnrollmentProgress()">[ 💾 บันทึก Progress ]</button>
            </div>
          </div>
          <div id="progressMsg" class="status" style="margin-top: 10px;"></div>
        </section>
      </div>

    </main>
  </div>

  <!-- Modal Form -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modalTitle">เพิ่มข้อมูล</h3>
      <div id="formFields"></div>
      <div class="btn-row" style="margin-top:20px;">
        <button class="btn primary" id="btnSave">บันทึก</button>
        <button class="btn" id="btnCancel">ยกเลิก</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
